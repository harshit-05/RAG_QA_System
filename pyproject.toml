[project]
name = "rag-qa-system"
version = "0.2.0.dev0"
description = "Config-driven local RAG question-answering engine built on LangChain, FAISS and Ollama."
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Harshit Deswal", email = "harshit.deswal@ilmfy.io" }]

# Import surface is fixed by DEC-1 rule 1 (ARCHITECTURE.md §0.1): application code
# imports only these packages. The `langchain` meta-package is deliberately absent,
# and `langchain-classic` is never imported even though it arrives transitively.
dependencies = [
    "langchain-core>=1,<2",
    "langchain-community>=0.4,<0.5",
    "langchain-text-splitters>=1,<2",
    "langchain-ollama>=1,<2",
    "langchain-huggingface>=1,<2",
    "faiss-cpu>=1.15",
    "sentence-transformers>=5",
    "torch>=2.6",
    "pypdf>=6",
    "docx2txt>=0.9",
    "pyyaml>=6",
    "pydantic>=2.11",
    "pydantic-settings>=2.10",
]

[project.scripts]
rag-ingest = "rag_qa.ingest:main"
rag-query = "rag_qa.cli:main"

[project.optional-dependencies]
# Evaluation harness. Wired into CI as a quality gate in Phase 2 (FR-7).
eval = [
    "ragas>=0.4",
    "datasets>=3",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.13",
    "mypy>=1.17",
    "pytest-cov>=7.1.0",
]

# This host is CPU-only (no NVIDIA GPU). `explicit = true` is load-bearing: as a
# general index, download.pytorch.org also serves stale langchain-community
# releases and uv silently resolves the whole stack down to LangChain 0.3.x.
# Scoped to torch, it yields torch+cpu with no nvidia-* wheels. See DEC-1 rule 2.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
testpaths = ["tests"]

# Lint (NFR-9, S1-6). Ruff 0.16's *default* rule set is broad (~790 rules: F, B,
# UP, SIM, RUF, PL*, PERF, ...), so this extends it rather than replacing it with
# a narrower explicit list, which would quietly weaken the gate. The one addition
# is E501, without which line-length would be a number nothing checks.
[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["E501"]

# Types (NFR-9, ISS-19). Every function in src/rag_qa carries annotations, and
# code after a return is an error: warn_unreachable is ISS-12's only guard
# (ruff 0.16 has no unreachable-code rule, even in preview). Tests are linted by
# ruff but not type-checked; fixtures are not worth annotating.
[tool.mypy]
files = ["src/rag_qa"]
disallow_untyped_defs = true
warn_unreachable = true
warn_unused_ignores = true
# Packages without type stubs (docx2txt, faiss, pandas/datasets in the eval
# extra) are treated as Any instead of failing the run.
ignore_missing_imports = true

# Coverage gate (NFR-8, S1-5). 80% is the SRS figure, deliberately not higher: a
# higher bar invites tests written for the number rather than the behaviour.
[tool.coverage.run]
source = ["rag_qa"]
# evaluate.py is Phase 2 work (FR-7) and imports the optional `eval` extra.
omit = ["*/rag_qa/evaluate.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_qa"]
