        values: *fast2_bucket
      - series: 'rag_abandoned_seconds_count{job="rag",instance="app:9464",waiting_for="first_token"}'
        values: *never
      - series: 'rag_abandoned_seconds_bucket{job="rag",instance="app:9464",waiting_for="first_token",le="300.0"}'
        values: *never
    alert_rule_test:
      - eval_time: 600m
        alertname: RagFirstTokenLatencyFastBurn
        exp_alerts: []
      - eval_time: 820m
        alertname: RagFirstTokenLatencyFastBurn
        exp_alerts:
          - exp_labels: { job: rag, severity: page }
            exp_annotations: *ttft_fast
      - eval_time: 875m
        alertname: RagFirstTokenLatencyFastBurn
        exp_alerts: []

  - name: NFR-2b, slow burn through 1 d and 2 h - 20% of first tokens slow for a day
    interval: 5m
    input_series:
      - series: 'rag_ttft_seconds_count{job="rag",instance="app:9464"}'
        values: *slow1_count
      - series: 'rag_ttft_seconds_bucket{job="rag",instance="app:9464",le="300.0"}'
        values: *slow1_bucket
      - series: 'rag_abandoned_seconds_count{job="rag",instance="app:9464",waiting_for="first_token"}'
        values: *never
      - series: 'rag_abandoned_seconds_bucket{job="rag",instance="app:9464",waiting_for="first_token",le="300.0"}'
        values: *never
    alert_rule_test:
      - eval_time: 24h
        alertname: RagFirstTokenLatencySlowBurn
        exp_alerts:
          - exp_labels: { job: rag, severity: ticket }
            exp_annotations: &ttft_slow
              summary: The first token is spending its latency budget (NFR-2b)
              description: First tokens over 300 s burn NFR-2b's 95% at 3 times its budget over 1 d, or at its budget over 3 d.
      - eval_time: 27h # the 2 h window is clean, the 6 h one is not: the 3 d and 6 h pair alone holds
        alertname: RagFirstTokenLatencySlowBurn
        exp_alerts:
          - exp_labels: { job: rag, severity: ticket }
            exp_annotations: *ttft_slow
      - eval_time: 31h
        alertname: RagFirstTokenLatencySlowBurn
        exp_alerts: []

  - name: NFR-2b, slow burn through 3 d and 6 h alone - 7% of first tokens slow steadily
    interval: 5m
    input_series:
      - series: 'rag_ttft_seconds_count{job="rag",instance="app:9464"}'
        values: *slow2_count
      - series: 'rag_ttft_seconds_bucket{job="rag",instance="app:9464",le="300.0"}'
        values: *slow2_bucket
      - series: 'rag_abandoned_seconds_count{job="rag",instance="app:9464",waiting_for="first_token"}'
        values: *never
      - series: 'rag_abandoned_seconds_bucket{job="rag",instance="app:9464",waiting_for="first_token",le="300.0"}'
        values: *never
    alert_rule_test:
      - eval_time: 24h
        alertname: RagFirstTokenLatencySlowBurn
        exp_alerts:
          - exp_labels: { job: rag, severity: ticket }
            exp_annotations: *ttft_slow

  - name: NFR-2b, a 2-hour burst of 50% slow after a good day stays quiet
    interval: 5m
    input_series:
      - series: 'rag_ttft_seconds_count{job="rag",instance="app:9464"}'
        values: *burst_count
      - series: 'rag_ttft_seconds_bucket{job="rag",instance="app:9464",le="300.0"}'
        values: *burst_bucket
      - series: 'rag_abandoned_seconds_count{job="rag",instance="app:9464",waiting_for="first_token"}'
        values: *never
      - series: 'rag_abandoned_seconds_bucket{job="rag",instance="app:9464",waiting_for="first_token",le="300.0"}'
        values: *never
    alert_rule_test:
      - eval_time: 26h
        alertname: RagFirstTokenLatencySlowBurn
        exp_alerts: []
      - eval_time: 26h
        alertname: RagFirstTokenLatencyFastBurn
        exp_alerts: []

  # --- answers abandoned before their event (S3-7b's fix) ---------------------------------
  - name: NFR-2b, a hung model whose clients leave after 5 minutes pages within the half hour
    interval: 1m
    input_series:
      # An hour of first tokens, all under 300 s; then none, and every client leaves after
      # more than 300 s. Before the fix nothing fired: the cancels counted in no SLI.
      - series: 'rag_ttft_seconds_count{job="rag",instance="app:9464"}'
        values: '0+2x60 120+0x60'
      - series: 'rag_ttft_seconds_bucket{job="rag",instance="app:9464",le="300.0"}'
        values: '0+2x60 120+0x60'
      - series: 'rag_abandoned_seconds_count{job="rag",instance="app:9464",waiting_for="first_token"}'
        values: '0x60 2+2x59'
      - series: 'rag_abandoned_seconds_bucket{job="rag",instance="app:9464",waiting_for="first_token",le="300.0"}'
        values: '0x120'
    alert_rule_test:
      - eval_time: 60m # answering
        alertname: RagFirstTokenLatencyFastBurn
        exp_alerts: []
      - eval_time: 75m # 15 minutes hung: 20% of the history, under 30%; 25% of the hour
        alertname: RagFirstTokenLatencyFastBurn
        exp_alerts: []
      - eval_time: 95m # 35 minutes: 37% of the history, and all of the last 30 minutes
        alertname: RagFirstTokenLatencyFastBurn
        exp_alerts:
          - exp_labels: { job: rag, severity: page }
            exp_annotations: *ttft_fast

  - name: NFR-2a, a hung retrieval whose clients leave pages within the half hour, NFR-2b not
    interval: 1m
    input_series:
      # An hour of sources events under 2 s; then none, every client leaving after more than
      # 2 s and less than 300: slow for NFR-2a, and for NFR-2b no first token known late.
      - series: 'rag_sources_seconds_count{job="rag",instance="app:9464"}'
        values: '0+10x60 600+0x60'
      - series: 'rag_sources_seconds_bucket{job="rag",instance="app:9464",le="2.0"}'
        values: '0+10x60 600+0x60'
      - series: 'rag_ttft_seconds_count{job="rag",instance="app:9464"}'
        values: '0+10x60 600+0x60'
      - series: 'rag_ttft_seconds_bucket{job="rag",instance="app:9464",le="300.0"}'
        values: '0+10x60 600+0x60'
      - series: 'rag_abandoned_seconds_count{job="rag",instance="app:9464",waiting_for="sources"}'
        values: '0x60 10+10x59'
      - series: 'rag_abandoned_seconds_bucket{job="rag",instance="app:9464",waiting_for="sources",le="2.0"}'
        values: '0x120'
      - series: 'rag_abandoned_seconds_bucket{job="rag",instance="app:9464",waiting_for="sources",le="300.0"}'
        values: '0x60 10+10x59'
    alert_rule_test:
      - eval_time: 75m
        alertname: RagSourcesLatencyFastBurn
        exp_alerts: []
      - eval_time: 95m
        alertname: RagSourcesLatencyFastBurn
        exp_alerts:
          - exp_labels: { job: rag, severity: page }
            exp_annotations: *sources_fast
      - eval_time: 95m # they left before 300 s: no first-token page on top
        alertname: RagFirstTokenLatencyFastBurn
        exp_alerts: []

  - name: NFR-2b, clients that leave before 300 s count on neither side
    interval: 5m
    input_series:
      # Every first token under 300 s, and three times as many clients leaving sooner: the SLI
      # stays at 0, where counting them as slow would page at once (75%).
      - series: 'rag_ttft_seconds_count{job="rag",instance="app:9464"}'
        values: '0+10x100'
      - series: 'rag_ttft_seconds_bucket{job="rag",instance="app:9464",le="300.0"}'
        values: '0+10x100'
      - series: 'rag_abandoned_seconds_count{job="rag",instance="app:9464",waiting_for="first_token"}'
        values: '0+30x100'
      - series: 'rag_abandoned_seconds_bucket{job="rag",instance="app:9464",waiting_for="first_token",le="300.0"}'
        values: '0+30x100'
    promql_expr_test:
      - expr: rag:ttft_slow:ratio_rate1h
        eval_time: 5h
        exp_samples:
          - labels: 'rag:ttft_slow:ratio_rate1h{job="rag"}'
            value: 0
    alert_rule_test:
      - eval_time: 5h
        alertname: RagFirstTokenLatencyFastBurn
        exp_alerts: []
      - eval_time: 5h
        alertname: RagFirstTokenLatencySlowBurn
        exp_alerts: []

  # --- the causes -------------------------------------------------------------------------
  - name: a breaker not closed for 5 minutes pages; its first minutes do not
    interval: 1m
    input_series:
      # Qdrant's breaker open from minute 3 to 12; the model's from 8 to 20. No hosted
      # fallback on this instance, so an open model breaker pages as well.
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="qdrant",state="closed"}'
        values: '1x2 0x9 1x13'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="qdrant",state="open"}'
        values: '0x2 1x9 0x13'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="qdrant",state="half-open"}'
        values: '0x25'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="llm",state="closed"}'
        values: '1x7 0x12 1x5'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="llm",state="open"}'
        values: '0x7 1x12 0x5'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="llm",state="half-open"}'
        values: '0x25'
    alert_rule_test:
      - eval_time: 5m # Qdrant's open, first seen: pending
        alertname: RagBreakerOpen
        exp_alerts: []
      - eval_time: 10m # Qdrant's for 5 minutes; the model's just seen, pending
        alertname: RagBreakerOpen
        exp_alerts:
          - exp_labels: { job: rag, instance: "app:9464", breaker: qdrant, severity: page }
            exp_annotations:
              summary: "app:9464: the qdrant breaker has been open for 5 minutes"
              description: &breaker_page The questions that need it are refused with 503 and Retry-After; /v1/health names the dependency, and the server log says why.
      - eval_time: 15m # Qdrant's closed again; the model's for 5 minutes
        alertname: RagBreakerOpen
        exp_alerts:
          - exp_labels: { job: rag, instance: "app:9464", breaker: llm, severity: page }
            exp_annotations:
              summary: "app:9464: the llm breaker has been open for 5 minutes"
              description: *breaker_page
      - eval_time: 25m # both closed
        alertname: RagBreakerOpen
        exp_alerts: []

  - name: a breaker flipping between open and half-open stays pending, then pages
    interval: 1m
    input_series:
      # Open from minute 5, half-open from 10 (its probe out), open again from 15 (the probe
      # failed), closed from 20.
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="qdrant",state="closed"}'
        values: '1x4 0x14 1x10'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="qdrant",state="open"}'
        values: '0x4 1x4 0x4 1x4 0x10'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="qdrant",state="half-open"}'
        values: '0x9 1x4 0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: RagBreakerOpen
        exp_alerts: []
      - eval_time: 10m # half-open now, not closed for 5 minutes
        alertname: RagBreakerOpen
        exp_alerts:
          - exp_labels: { job: rag, instance: "app:9464", breaker: qdrant, severity: page }
            exp_annotations:
              summary: "app:9464: the qdrant breaker has been open for 5 minutes"
              description: *breaker_page
      - eval_time: 20m
        alertname: RagBreakerOpen
        exp_alerts: []

  - name: the model's breaker with a hosted fallback is a ticket, worded for the fallback
    interval: 1m
    input_series:
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="llm",state="closed"}'
        values: '1x1 0x10 1x6'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="llm",state="open"}'
        values: '0x1 1x10 0x6'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="llm",state="half-open"}'
        values: '0x19'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="fallback",state="closed"}'
        values: '1x19'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="fallback",state="open"}'
        values: '0x19'
      - series: 'rag_breaker_state{job="rag",instance="app:9464",breaker="fallback",state="half-open"}'
        values: '0x19'
    alert_rule_test:
      - eval_time: 5m # open, first seen: pending
        alertname: RagBreakerOpen
        exp_alerts: []
      - eval_time: 10m # open for 5 minutes: the ticket, and no page
        alertname: RagBreakerOpen
        exp_alerts:
          - exp_labels: { job: rag, instance: "app:9464", breaker: llm, severity: ticket }
            exp_annotations:
              summary: "app:9464: the llm breaker has been open for 5 minutes"
              description: Answers come from the hosted fallback and leave the host, the questions and their retrieved chunks with them, until Ollama answers again.
      - eval_time: 15m
        alertname: RagBreakerOpen
        exp_alerts: []

  - name: a failed ingest job is a ticket for an hour
    interval: 1m
    input_series:
      - series: 'rag_ingest_runs_total{job="rag",instance="app:9464",status="failed"}'
        values: '0x10 1x80'
      - series: 'rag_ingest_runs_total{job="rag",instance="app:9464",status="succeeded"}'
        values: '0+1x90'
    alert_rule_test:
      - eval_time: 5m # none failed yet
        alertname: RagIngestFailed
        exp_alerts: []
      - eval_time: 20m
        alertname: RagIngestFailed
        exp_alerts:
          - exp_labels: { job: rag, instance: "app:9464", severity: ticket }
            exp_annotations:
              summary: "app:9464: an ingest job failed in the last hour"
              description: GET /v1/ingest/<job_id> has its exit code and its log; the live index changed only if the job published.
      - eval_time: 80m # the failure is more than an hour old
        alertname: RagIngestFailed
        exp_alerts: []

  - name: a replica that does not answer its scrape pages after 5 minutes
    interval: 1m
    input_series:
      - series: 'up{job="rag",instance="app:9464"}'
        values: '1x4 0x10 1x5'
      # Another job's target, down all along (Prometheus's own, say): no page of ours.
      - series: 'up{job="other",instance="elsewhere:9090"}'
        values: '0x20'
    alert_rule_test:
      - eval_time: 5m # down, first seen: pending
        alertname: RagTargetDown
        exp_alerts: []
      - eval_time: 10m
        alertname: RagTargetDown
        exp_alerts:
          - exp_labels: { job: rag, instance: "app:9464", severity: page }
            exp_annotations:
              summary: "app:9464: the metrics port has not answered for 5 minutes"
              description: rag-serve runs but does not answer, or it serves no metrics (RAG_API_METRICS_PORT).
      - eval_time: 10m # the target is still discovered: nothing is missing
        alertname: RagTargetMissing
        exp_alerts: []
      - eval_time: 20m
        alertname: RagTargetDown
        exp_alerts: []

  - name: every replica gone, so no up at all, pages after 5 minutes
    interval: 1m
    input_series:
      # The replica exits at minute 5: Docker's DNS drops it, and so does discovery, which
      # ends its series (a stale marker) rather than reporting it down.
      - series: 'up{job="rag",instance="172.18.0.5:9464"}'
        values: '1x4 stale'
    alert_rule_test:
      - eval_time: 0m # running
        alertname: RagTargetMissing
        exp_alerts: []
      - eval_time: 5m # gone, first seen: pending
        alertname: RagTargetMissing
        exp_alerts: []
      - eval_time: 10m
        alertname: RagTargetMissing
        exp_alerts:
          - exp_labels: { job: rag, severity: page }
            exp_annotations:
              summary: No rag_qa API replica has been scraped for 5 minutes
              description: Prometheus finds no app to scrape. Every replica has exited, or none was started.
      - eval_time: 10m # and RagTargetDown cannot fire: there is no up to be 0
        alertname: RagTargetDown
        exp_alerts: []
