# CI — ARCHITECTURE.md §1.5 and §2.5, DEC-11, DEC-15.
#
# Gates run cheapest first and all block. Each gate is added by the story that
# makes it passable: ruff + pytest here (S1-2), coverage (S1-5), mypy (S1-6),
# pip-audit (S1-8), the tier-1 retrieval eval (S2-3), the tier-2 check (S2-5b),
# the format check (S3-1), Qdrant as a service and its server tests (S3-2), and the
# deploy files' checks and the alert rules' tests (S3-7b).
#
# The check job is hermetic by design: no Ollama, no model download, no network in
# the suite. HF_HUB_OFFLINE is the tripwire for that: a test that tries to fetch an
# embedding model fails loudly here instead of quietly downloading ~90 MB. The
# eval-retrieval job is the one exception, and its comment says why.

name: CI

# push runs on main and on release tags only. A branch that has a PR is tested by the
# pull_request run, so a push to it would repeat the same work: with eval-retrieval,
# about 2.5 minutes of network time twice per push (S2-3 review). main's own push is
# also what writes the HF model cache that PR runs restore: a cache written on a PR is
# visible to that PR only. Open the PR to get CI on a story branch.
#
# tags is load-bearing: with branches alone, GitHub runs nothing for a tag push, and
# each release is tagged with CI green on the tag itself (v0.2; S2-3's second review).
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
      # Test on the same uv-managed CPython as development. .python-version says
      # only "3.12", and uv would otherwise take the runner's system 3.12 (3.12.3
      # in S1-2's run, ten patch releases behind).
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      # Actions pinned to full commit SHAs (supply chain, OWASP LLM05); the tag is
      # in the comment. Bump both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.8"      # the uv this project is developed with (CLAUDE.md)
          enable-cache: true     # keyed on uv.lock
          cache-python: true     # caches the managed CPython that UV_PYTHON_PREFERENCE selects

      # --locked fails if uv.lock has drifted from pyproject.toml, so this step is
      # also the lockfile check. CPU torch only (DEC-1 rule 2): no nvidia-* wheels.
      - name: Install
        run: uv sync --locked

      # The torch variant is chosen by dependency groups (S1-7): `cpu` is a default
      # group. If it is ever dropped, or an install reaches `--no-default-groups`,
      # torch arrives from PyPI as the CUDA build with GBs of nvidia-* wheels, and
      # silently. Fail here instead. `--no-sync` is load-bearing: a plain `uv run`
      # re-syncs to the default groups first, which would repair the second case
      # and then pass, so it checks what the Install step actually installed.
      - name: CPU torch only (DEC-1 rule 2)
        run: uv run --no-sync python -c "import sys, torch; print(torch.__version__); sys.exit(0 if torch.__version__.endswith('+cpu') else 1)"

      - name: Lint
        run: uv run ruff check

      # Formatting (DEC-28, S3-1). The code was formatted once, in the commit that
      # .git-blame-ignore-revs names, and this keeps it so: red here means
      # `uv run ruff format` has something to change. Markdown is excluded in
      # pyproject.toml's [tool.ruff.format].
      - name: Format
        run: uv run ruff format --check

      # Types (NFR-9, S1-6). Settings live in pyproject.toml's [tool.mypy];
      # warn_unreachable there is ISS-12's only guard (code after a return).
      - name: Types
        run: uv run mypy

      # Coverage gate (NFR-8, S1-5): the threshold and what is omitted live in
      # pyproject.toml's [tool.coverage], so a local `pytest --cov` enforces the same.
      - name: Test
        run: uv run pytest --cov=rag_qa

      # Dependency audit (OWASP LLM05, SRS §11, S1-8). Audits what the Install step
      # installed, not uv.lock, which records both torch variants. A plain
      # `pip-audit` skips torch: it looks up `2.14.0+cpu` on PyPI, finds no such
      # release, and only warns. The CPU wheel is built from the same source release
      # as PyPI's 2.14.0, so the local label is stripped and torch is audited
      # under its public version. Only torch's label is rewritten, so any other local
      # label stays visible to the audit. The project itself is excluded (not on PyPI).
      # The freeze goes to a file and must be non-empty: GitHub's default shell has no
      # pipefail, and pip-audit reports "no vulnerabilities" for an empty input.
      #
      # One exception to the audit policy, which allows no ignore for an advisory with a
      # fixed release (DEC-24). The maintainer took it on 2026-10-22 (STATUS.md, caveat 37),
      # and extended it on 2026-10-23 to three more found by S3-6's CI, and on 2026-10-24 to
      # three more found by S3-7's. Five pypdf 6.19.0 advisories were published on
      # 2026-10-21, three on 2026-10-22 and three on 2026-10-23. The releases that fix them
      # (6.20.0 to 6.21.2) extract the corpus's text differently: 7 of the 25 golden
      # contexts change, so the bump needs CHUNKING_VERSION 2 and a tier-2 re-run, which
      # S3-11b's one re-run carries (DEC-26). Until then:
      #   GHSA-5hx5-vpf9-5wcv  JPEG data handed to Pillow: image extraction, never called
      #   GHSA-9mx8-4j7g-633p  a loop removing tree items: editing, never called
      #   GHSA-qfv9-64jg-mh7p  a loop in PdfWriter.find_outline_item: writing, never called
      #   GHSA-6vvc-x485-93v7  memory or time retrieving form fields: get_fields, never called
      #   GHSA-39mj-jf6j-2qj3  a loop at EOF in a standard xref table: reached by any read
      #   GHSA-7mh2-4gg2-979f  memory for streams with many filters: reached by extract_text
      #   GHSA-cgf9-327m-v77c  memory for content streams of many operations: extract_text
      #   GHSA-f54x-cmq8-qg57  memory for arrays or dictionaries of many items: any read
      #   GHSA-gmh7-3g9r-mjh5  time for wrong upper limits in an xref table: any read
      #   GHSA-jr96-gvgh-j3r4  time for repeated malformed xref streams: any read
      #   GHSA-6c7f-9265-g8fw  time for many references to one missing object: reader.pages
      # The last seven need a hostile PDF in corpus/, which only the operator fills: the
      # corpus is trusted, and nothing uploads into it (ARCHITECTURE.md, Phase 3, item 9).
      # The exception ends with S3-11b's bump, or on 2027-01-20 (90 days, as DEC-24 limits
      # Trivy's ignores), whichever comes first: after that date this step fails until the
      # date check and the eleven ignores are removed.
      - name: Audit
        run: |
          set -o pipefail
          if [[ "$(date -u +%F)" > 2027-01-20 ]]; then
            echo "The pypdf audit exception expired on 2027-01-20 (STATUS.md, caveat 37)" >&2
            exit 1
          fi
          uv pip freeze --exclude-editable | sed 's/^\(torch==.*\)+cpu$/\1/' > "$RUNNER_TEMP/audit.txt"
          test -s "$RUNNER_TEMP/audit.txt"
          uv run --no-sync pip-audit --no-deps --disable-pip --progress-spinner off -r "$RUNNER_TEMP/audit.txt" \
            --ignore-vuln GHSA-5hx5-vpf9-5wcv --ignore-vuln GHSA-9mx8-4j7g-633p \
            --ignore-vuln GHSA-qfv9-64jg-mh7p --ignore-vuln GHSA-6vvc-x485-93v7 \
            --ignore-vuln GHSA-39mj-jf6j-2qj3 --ignore-vuln GHSA-7mh2-4gg2-979f \
            --ignore-vuln GHSA-cgf9-327m-v77c --ignore-vuln GHSA-f54x-cmq8-qg57 \
            --ignore-vuln GHSA-gmh7-3g9r-mjh5 --ignore-vuln GHSA-jr96-gvgh-j3r4 \
            --ignore-vuln GHSA-6c7f-9265-g8fw

      # Tier 2 of the quality bar (DEC-15, S2-5b): the committed run in eval/runs/ against
      # eval/thresholds.yaml and this checkout. It needs no models, no Ollama and no eval
      # extra, so it stays in this hermetic job. Exit 1: a floor is missed, or the run is
      # stale, and the log names the re-run that fixes it (generate and score, or score
      # only). Editing a hashed input (the prompt, the llm, retriever or reranker spec, the
      # corpus, the splitter, the golden set, the judge's Modelfile) turns this red until
      # tier 2 is run again. Exit 2: it could not run.
      - name: Tier-2 check
        run: uv run rag-eval check

  # Tier 1 of the quality bar (DEC-15, S2-3): retrieval scored against the golden set
  # (hit rate, MRR, recall), recomputed on every pull request and every push to main
  # against eval/thresholds.yaml.
  #
  # The only job with network access (STATUS.md caveat 19). Scoring needs the real
  # embedder's and the reranker's weights (~90 MB each), which the hermetic check job must
  # never fetch. Only the ingest and warm-up steps may reach the network, and only on a
  # cache miss: on an exact hit they run offline too (see the ingest step). The eval step
  # always runs under HF_HUB_OFFLINE=1.
  #
  # Red here while check is green: read the eval step's exit. 1 means retrieval ran and
  # missed a floor, so retrieval quality moved. 2 means it could not run (a model missing
  # offline, an unreadable index), and the log holds the traceback.
  eval-retrieval:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20  # a few minutes expected; a stalled download must not run for hours
    env:
      UV_PYTHON_PREFERENCE: only-managed  # the same CPython as the check job
      # The index lives in Qdrant (DEC-19, S3-2): this job's own service below, under a
      # collection of its own. No key: the service is reachable from this runner only.
      RAG_QDRANT_URL: http://localhost:6333
      RAG_QDRANT_COLLECTION: ci
    # The same image compose.yaml runs, pinned by the same index digest (DEC-24's table).
    # The unprivileged image has no curl or wget for a health command, so the wait step
    # below asks /readyz from the runner instead.
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.2-unprivileged@sha256:efb96a9425a90d2d5a1a0a474156280df1892dcdf1af3e8515bd2589b1bfd88b
        ports:
          - 6333:6333
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.8"
          enable-cache: true
          cache-python: true

      - name: Install
        run: uv sync --locked

      # Every command checks Qdrant first and exits 2 without it; a container still
      # starting would read as "Qdrant is not running".
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 30); do
            curl -sf http://localhost:6333/readyz && exit 0
            sleep 1
          done
          echo "Qdrant did not become ready in 30 s" >&2
          exit 1

      # Keyed on the model names, not on config.yaml, so a prompt edit keeps the weights.
      # The key names the models config.yaml uses, the embedder then the reranker: update
      # it with them. When it changes, the prefix restore key brings back the old weights,
      # and only the new model downloads.
      - name: Restore the HF models
        id: hf-models
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-sentence-transformers--all-MiniLM-L6-v2--cross-encoder--ms-marco-MiniLM-L-6-v2
          restore-keys: hf-${{ runner.os }}-

      # The real corpus into the service's scratch collection; never a committed or cached
      # index. This step downloads the embedder on a cache miss. On an exact hit it runs
      # offline: online, loading even a fully cached model sends huggingface.co a request
      # per file (33, measured in S2-3's second review), and would fetch a newer upstream
      # revision of the model, which CI would then embed with and never cache. "0" is false
      # to huggingface_hub. The writer lock goes to the runner's temp folder.
      - name: Ingest the corpus
        env:
          RAG_STATE_PATH: ${{ runner.temp }}/state
          HF_HUB_OFFLINE: ${{ steps.hf-models.outputs.cache-hit == 'true' && '1' || '0' }}
        run: uv run rag-ingest

      # rag-ingest loads only the embedder, so the reranker's cross-encoder is fetched
      # here (S2-4), before the save below and the offline eval step. It is built from
      # config.yaml through build_reranker, not downloaded by name, so the cache holds
      # exactly the files the eval step opens. Offline on an exact hit, as ingest is.
      - name: Warm up the reranker
        env:
          HF_HUB_OFFLINE: ${{ steps.hf-models.outputs.cache-hit == 'true' && '1' || '0' }}
        run: uv run python -c "from rag_qa.components import build_reranker; from rag_qa.config import load_config; print(build_reranker(load_config()))"

      # Saved here, once ingest and the warm-up have filled it, rather than at the end of
      # the job: a first run that misses a floor still caches the weights for the re-run.
      - name: Save the HF models
        if: steps.hf-models.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/huggingface
          key: ${{ steps.hf-models.outputs.cache-primary-key }}

      - name: Retrieval eval (offline)
        env:
          HF_HUB_OFFLINE: "1"
        run: uv run rag-eval retrieval

      # What the hermetic suite cannot show, because local mode is a reimplementation in
      # Python (DEC-19, §3.5): the server's atomic alias batch, recovery with no alias, the
      # metadata round trip, a bit-exact copy, and ties cut alike from collections built in
      # different orders. Each test works under a collection name of its own.
      - name: Qdrant server tests (offline)
        env:
          HF_HUB_OFFLINE: "1"
          RAG_TEST_QDRANT_URL: http://localhost:6333
        run: uv run pytest -m qdrant_server

  # The deploy files (DEC-22, DEC-24, S3-7b): Prometheus's config and the alert rules it loads
  # checked, the rules' unit tests run (each alert firing and quiet, at each window), and
  # Alertmanager's config checked. promtool and amtool run from the images S3-9's compose
  # runs, pinned by index digest as DEC-24's table has them (each checked against Quay's), so
  # nothing is installed on the runner. Prometheus publishes no signatures; the image's promtool
  # is byte-identical to the release tarball's (design review 2). No network beyond the pulls.
  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROMETHEUS: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
      ALERTMANAGER: prom/alertmanager:v0.34.1@sha256:e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check Prometheus's config and its rules
        run: docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool "$PROMETHEUS" check config /p/prometheus.yml

      # About 30 s: promtool evaluates every rule at each step of each scenario. The causes'
      # file evaluates every minute, over short scenarios, to tell `for: 5m` from `for: 1m`.
      - name: Test the alert rules
        run: docker run --rm -v "$PWD/deploy/prometheus:/p:ro" --entrypoint promtool "$PROMETHEUS" test rules /p/rules.test.yml /p/rules.causes.test.yml

      - name: Check Alertmanager's config
        run: docker run --rm -v "$PWD/deploy/alertmanager:/a:ro" --entrypoint amtool "$ALERTMANAGER" check-config /a/alertmanager.yml
