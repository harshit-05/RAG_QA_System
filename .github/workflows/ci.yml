# CI — ARCHITECTURE.md §1.5, DEC-11.
#
# Gates run cheapest first and all block. Each gate is added by the story that
# makes it passable: ruff + pytest here (S1-2), coverage (S1-5), mypy (S1-6),
# pip-audit (S1-8).
#
# Hermetic by design: no Ollama, no model download, no network in the suite.
# HF_HUB_OFFLINE is the tripwire for that: a test that tries to fetch an
# embedding model fails loudly here instead of quietly downloading ~90 MB.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HF_HUB_OFFLINE: "1"
    steps:
      # Actions pinned to full commit SHAs (supply chain, OWASP LLM05); the tag is
      # in the comment. Bump both together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.11.8"      # the uv this project is developed with (CLAUDE.md)
          enable-cache: true     # keyed on uv.lock
          cache-python: true     # the uv-managed 3.12 from .python-version

      # --locked fails if uv.lock has drifted from pyproject.toml, so this step is
      # also the lockfile check. CPU torch only (DEC-1 rule 2): no nvidia-* wheels.
      - name: Install
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check

      - name: Test
        run: uv run pytest
