# config.yaml — schema contract in ARCHITECTURE.md §0.3.
#
# Two halves, and the split is the point:
#   components: the library of buildable things (any dict with _target_)
#   pipeline:   the assembly, referencing components by dotted path
# Swapping a model or a splitter is a pipeline reference change, not a code change.

# ----------------- 1. Component library -----------------
components:
  loaders:
    # Our own loaders on pypdf / docx2txt (DEC-5 step 1, S1-3); which file types
    # use which loader is pipeline.ingestion.loaders below, not a key here.
    pdf:
      _target_: rag_qa.loaders.PdfLoader
    docx:
      _target_: rag_qa.loaders.DocxLoader
    txt:
      _target_: rag_qa.loaders.TextLoader

  splitters:
    english_recursive:
      _target_: langchain_text_splitters.RecursiveCharacterTextSplitter
      chunk_size: 1000
      chunk_overlap: 150

  embedders:
    # Model and device are two independent axes, so each entry names both.
    # `pipeline.ingestion.embedder` below picks one; nothing else needs editing.
    #
    # Two things to know before switching:
    #
    # 1. Changing embedder invalidates an existing index: a different model means
    #    different vectors. rag-query refuses such an index before loading any
    #    model, and `rag-ingest` rebuilds it in full (DEC-17). Moving between an
    #    entry's _cpu and _cuda forms keeps the index: the device is not part of
    #    the embedder's identity.
    # 2. A `_cuda` entry needs BOTH an NVIDIA GPU and the CUDA torch variant.
    #    A plain `uv sync` installs CPU torch on purpose (DEC-1 rule 2); on a GPU
    #    host (Colab/Kaggle) install the CUDA variant instead:
    #        uv sync --no-group cpu --group cuda
    #    then run with `uv run --no-sync rag-ingest` (and rag-query): a plain
    #    `uv run` re-syncs to the default groups and puts CPU torch back.
    #    README "GPU embeddings" has the whole recipe. On this host a `_cuda` entry fails fast and clearly ("Torch not compiled
    #    with CUDA enabled"), so it is a documented option, never a silent
    #    degradation.

    # Default. Fast, 384-dim, and the only one this host can actually run.
    minilm_cpu:
      _target_: langchain_huggingface.HuggingFaceEmbeddings
      model_name: "sentence-transformers/all-MiniLM-L6-v2"
      model_kwargs: {"device": "cpu"}

    # Same model on a GPU. Intended for the Colab/Kaggle bulk re-embedding runs
    # in the GPU offload notes in stories/STATUS.md, not for this machine.
    minilm_cuda:
      _target_: langchain_huggingface.HuggingFaceEmbeddings
      model_name: "sentence-transformers/all-MiniLM-L6-v2"
      model_kwargs: {"device": "cuda"}

    # Non-English or mixed-language corpora. 768-dim, so a larger index and
    # noticeably slower on CPU, but it runs here.
    multilingual_mpnet_cpu:
      _target_: langchain_huggingface.HuggingFaceEmbeddings
      model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
      model_kwargs: {"device": "cpu"}

    multilingual_mpnet_cuda:
      _target_: langchain_huggingface.HuggingFaceEmbeddings
      model_name: "sentence-transformers/paraphrase-multilingual-mpnet-base-v2"
      model_kwargs: {"device": "cuda"}

  llms:
    # DEC-2: mistral is the Phase 0 query model — same weight class as qwen2:7b
    # but already pulled here, so zero download.
    # num_ctx 4096 because k=5 x 1000-char chunks overflows Ollama's 2048 default
    # silently, which reads as an ungrounded answer rather than an error.
    # temperature 0 so the Phase 2 evaluation harness is reproducible.
    mistral_ollama:
      _target_: langchain_ollama.ChatOllama
      model: "mistral"
      temperature: 0
      num_ctx: 4096
      num_predict: 512
      validate_model_on_init: true
    # DEC-2 light fallback (2.2 GB vs mistral's ~5 GB resident). Use it when free
    # memory is tight: point pipeline.query.llm here. Same settings otherwise.
    phi3_ollama:
      _target_: langchain_ollama.ChatOllama
      model: "phi3"
      temperature: 0
      num_ctx: 4096
      num_predict: 512
      validate_model_on_init: true
    # Kept for the DEC-2 revisit once the eval harness exists (Phase 2).
    # Not pulled on this host: enabling this without `ollama pull qwen2:7b`
    # fails fast at construction thanks to validate_model_on_init.
    qwen2_ollama:
      _target_: langchain_ollama.ChatOllama
      model: "qwen2:7b"
      temperature: 0
      num_ctx: 4096
      num_predict: 512
      validate_model_on_init: true

  retrievers:
    vector_search:
      # Kwargs passed straight to VectorStore.as_retriever().
      search_kwargs: {"k": 5}

  rerankers:
    # Our own cross-encoder (DEC-16, S2-4). It reads the question with each of the
    # retriever's candidates, scores how well the chunk answers it, and keeps the best
    # top_n. Named by model and device, like the embedders; pipeline.query.reranker
    # below picks one. The first use downloads the model, about 90 MB.
    # min_score (off unless set) drops chunks scoring below it, in the model's own
    # units (logits for ms-marco). Tuning it waits for tier 2 (S2-5).
    ms_marco_minilm_cpu:
      _target_: rag_qa.rerankers.CrossEncoderReranker
      model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
      top_n: 5
      device: cpu
    # Same model on a GPU, for Colab/Kaggle: needs the CUDA torch variant (see the
    # embedders' note 2). On this host it fails fast, as the _cuda embedders do.
    ms_marco_minilm_cuda:
      _target_: rag_qa.rerankers.CrossEncoderReranker
      model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
      top_n: 5
      device: cuda

# ----------------- 2. Pipeline assembly -----------------
pipeline:
  ingestion:
    # File extension → loader. The corpus is walked recursively; a file whose
    # lowercased suffix is not listed here is skipped (reported, not failed).
    # .doc is deliberately absent: docx2txt cannot read the legacy binary format.
    loaders:
      ".pdf": components.loaders.pdf
      ".docx": components.loaders.docx
      ".txt": components.loaders.txt
      ".md": components.loaders.txt
    splitter: components.splitters.english_recursive
    # Swap this line to change embedding model or device, then re-run
    # `rag-ingest`: a new model rebuilds the index in full, a new device keeps it.
    #   components.embedders.minilm_cuda              GPU: the CUDA variant (see note 2 above)
    #   components.embedders.multilingual_mpnet_cpu   non-English corpora
    embedder: components.embedders.minilm_cpu

  query:
    llm: components.llms.mistral_ollama
    retriever: components.retrievers.vector_search
    # Reranking is on because tier 1 said so (S2-4, 2026-10-04). The retriever fetches
    # reranker_candidates chunks in place of its own k, and the reranker keeps the best
    # top_n (5). The two lines go together: comment out both to switch it off, and the
    # retriever's k=5 applies again (20 chunks never reach the prompt unreranked).
    # Measured on the 20 answerable golden questions:
    #                                     hit rate      MRR     recall
    #   (a) dense, k=5                    0.800     0.5875   0.7167
    #   (b) 20 candidates, reranked to 5  0.950     0.7958   0.8583
    #   Question by question, (b) wins 8 (three misses become hits), loses 4 (each
    #   still a hit, ranked lower) and ties 8. The rerank takes 1.4 s per question on
    #   this CPU (median), against minutes of generation; loading the model adds
    #   about 2.5 s at startup. Detail in stories/phase-2/S2-4-reranker.md.
    reranker: components.rerankers.ms_marco_minilm_cpu
    reranker_candidates: 20

    # The query-time embedder is always pipeline.ingestion.embedder: an index and
    # the queries against it must share an embedding model or the vectors are
    # incomparable. Not repeated here on purpose.
    # Instructions and retrieved content live in different chat roles (OWASP
    # LLM01): the system turn holds the rules, the human turn holds the untrusted
    # context. Wording carried over from v2 unchanged, except the trailing
    # "Answer:" cue, which the assistant turn now replaces.
    # {context} is filled with numbered chunks, "[1] (file.pdf, p. 3)\n...".
    prompt:
      system: |
        You are a helpful and precise assistant. Answer the user's question based only on the following context.
        If the answer is not available in the context, say "I could not find the answer in the provided documents."
        Do not use any prior knowledge.
      human: |
        Context:
        {context}

        Question: {question}

# ----------------- 3. Paths -----------------
# Relative to THIS FILE's directory, so a fresh clone works anywhere (NFR-11).
# Override either with RAG_DATA_PATH / RAG_VECTOR_STORE_PATH; point at a
# different config file with RAG_CONFIG.
paths:
  data: corpus
  vector_store: vectorstore/db_faiss

# ----------------- 4. Evaluation -----------------
# Read by rag-eval only: tier 2 of the quality bar (DEC-15, S2-5). rag-ingest, rag-query
# and the API ignore it.
evaluation:
  # The core of the refusal sentence the system prompt asks for. An answer to a question
  # the corpus cannot answer counts as a decline when it contains this (in any case) and
  # none of that golden record's must_not_contain words. It must appear in
  # pipeline.query.prompt.system: edit the refusal sentence, and the config says so.
  decline_marker: "could not find the answer"
  judge:
    # Build it once per machine: ollama create rag-judge -f eval/judge.Modelfile
    # The Modelfile sets the judge's context (8k) and sampling; Ollama's OpenAI endpoint
    # cannot set the context per request, and its 4k default would truncate silently.
    model: "rag-judge"
    modelfile: "judge.Modelfile"                # in the eval folder, beside the golden set
    base_url: "http://localhost:11434/v1"       # Ollama's OpenAI-compatible endpoint
    # What answer relevancy compares questions with, on CPU: the ingestion embedder's
    # model, so it is usually cached already (else one ~90 MB download).
    embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
    # Per judge call. S2-5's spike measured up to 768 s for one call on this CPU.
    timeout_s: 2400
